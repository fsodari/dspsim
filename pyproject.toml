[project]
name = "dspsim"
version = "0.4.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Frank" }
]
requires-python = ">=3.14"
dependencies = [
    "nanobind>=3.0.1",
    "nanobind-backend>=1.0.0",
]

[project.scripts]
dspsim = "dspsim:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.{h,c,hpp,cpp}" }, { file = "CMakeLists.txt" }]

[dependency-groups]
dev = [
    "nanobind>=3.0.1",
    "nanobind-backend>=1.0.0",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "scikit-build-core>=1.0.3",
]

[build-system]
requires = ["scikit-build-core>=1.0.3", "nanobind>=3.0.1", "nanobind-backend>=1.0.0"]
build-backend = "scikit_build_core.build"

